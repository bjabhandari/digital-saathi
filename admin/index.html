<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Digital Saathi</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e2616">
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <img src="../assets/img/logo.png" alt="Digital Saathi" width="96" height="96">
      <h1>Admin panel</h1>
      <p class="muted">Sign in to manage orders, messages and website content.</p>
      <label for="login-pw">Password</label>
      <input id="login-pw" type="password" autocomplete="current-password" required>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn btn--primary btn--block">Sign in</button>
      <a class="muted small" href="../index.html">← Back to website</a>
    </form>
  </section>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard"><img src="../assets/img/logo-white-sm.png" alt="" width="40" height="40"><span>Digital Saathi<small>Admin</small></span></a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <a href="../index.html" target="_blank" rel="noopener">View website ↗</a>
        <button type="button" id="logout">Log out</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="toast" id="toast" role="status"></div>

  <script src="admin.js"></script>
</body>
</html>
